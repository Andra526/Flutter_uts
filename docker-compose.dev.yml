# Pengembangan di laptop: hanya PostgreSQL di Docker.
# Backend, website, dan Flutter dijalankan biasa (npm run start:dev, npm run dev, flutter run).
#   docker compose -f docker-compose.dev.yml up -d
name: gymfit-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymfit
      POSTGRES_PASSWORD: gymfit
      POSTGRES_DB: gymfit
    ports:
      - "127.0.0.1:5432:5432"   # hanya bisa diakses dari laptop ini
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymfit -d gymfit"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata_dev:
